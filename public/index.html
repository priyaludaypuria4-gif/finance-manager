
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div>
        <h1>Finance Manager</h1>
        <p class="subtitle">Take control of your money.</p>
      </div>
      <div id="user-area" class="hidden">
        <span id="welcome-user"></span>
        <button id="logout-btn" class="secondary-btn">Log out</button>
      </div>
    </header>

    <div id="message" class="message hidden"></div>

    <section id="auth-section" class="panel auth-panel">
      <div class="auth-tabs">
        <button id="login-tab" class="tab active">Login</button>
        <button id="register-tab" class="tab">Register</button>
      </div>

      <form id="auth-form">
        <div id="name-group" class="form-group hidden">
          <label for="name">Full name</label>
          <input id="name" type="text" placeholder="Your name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" required minlength="8" placeholder="At least 8 characters">
        </div>

        <button id="auth-submit" class="primary-btn" type="submit">Login</button>
      </form>
    </section>

    <main id="dashboard" class="hidden">
      <section class="summary-grid">
        <article class="summary-card">
          <p>Total balance</p>
          <h2 id="balance">₹0.00</h2>
        </article>
        <article class="summary-card income-card">
          <p>Total income</p>
          <h2 id="income">₹0.00</h2>
        </article>
        <article class="summary-card expense-card">
          <p>Total expenses</p>
          <h2 id="expenses">₹0.00</h2>
        </article>
        <article class="summary-card">
          <p>Transactions</p>
          <h2 id="transaction-count">0</h2>
        </article>
      </section>

      <section class="panel">
        <h2 id="form-heading">Add a transaction</h2>

        <form id="transaction-form">
          <input id="transaction-id" type="hidden">

          <div class="form-grid">
            <div class="form-group">
              <label for="title">Description</label>
              <input id="title" type="text" required placeholder="e.g. Monthly salary">
            </div>

            <div class="form-group">
              <label for="amount">Amount (₹)</label>
              <input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
            </div>

            <div class="form-group">
              <label for="type">Type</label>
              <select id="type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Salary">Salary</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="transaction-date">Date</label>
              <input id="transaction-date" type="date" required>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="save-btn" class="primary-btn">Add transaction</button>
            <button type="button" id="cancel-edit" class="secondary-btn hidden">Cancel edit</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>Recent transactions</h2>
          <button id="refresh-btn" class="secondary-btn">Refresh</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Description</th>
                <th>Category</th>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="transaction-list">
              <tr>
                <td colspan="6" class="empty-state">No transactions yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
